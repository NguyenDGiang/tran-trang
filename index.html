<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbe3e5">
  <meta name="description" content="Một món quà 20/10 đầy yêu thương dành riêng cho Trần Trang.">
  <title>Gửi Trần Trang — Món quà 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blush: #fbe3e5;
      --blush-deep: #f7cbd0;
      --rose: #d94b67;
      --rose-deep: #ad2e4c;
      --rose-light: #f58aa0;
      --cream: #fffaf5;
      --paper: #fffdf8;
      --ink: #54343e;
      --leaf: #6f9c67;
      --leaf-dark: #4f7951;
      --gold: #e7b96c;
      --script: "Dancing Script", cursive;
      --sans: "Be Vietnam Pro", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--blush);
      font-family: var(--sans);
      overflow: hidden;
    }

    button { font: inherit; -webkit-tap-highlight-color: transparent; }

    .scene {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(255,255,255,.78), transparent 24rem),
        radial-gradient(circle at 84% 84%, rgba(245,138,160,.2), transparent 25rem),
        var(--blush);
      transition: opacity 700ms ease, transform 700ms cubic-bezier(.2,.75,.2,1), visibility 700ms;
    }

    .scene[hidden] { display: none; }
    .scene.is-leaving { opacity: 0; transform: scale(1.08); visibility: hidden; }

    .intro-inner {
      position: relative;
      display: grid;
      place-items: center;
      width: min(620px, 92vw);
      min-height: min(780px, 94svh);
      text-align: center;
    }

    .intro-label {
      position: absolute;
      top: clamp(20px, 6vh, 58px);
      margin: 0;
      color: var(--rose-deep);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in 800ms 500ms forwards;
    }

    @keyframes fade-in { to { opacity: 1; } }

    .rose-button {
      position: relative;
      width: min(350px, 66vw);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 25px 24px rgba(128,49,67,.12));
    }

    .rose-button .rose-art {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;
      transform-origin: 50% 80%;
      transform: translateY(18px) scale(.94) rotate(-1.5deg);
      filter: saturate(.94) drop-shadow(0 22px 24px rgba(111,43,59,.18));
      animation: rose-bloom-in 1.45s 250ms cubic-bezier(.18,.8,.2,1) forwards;
      transition: transform 500ms cubic-bezier(.2,.8,.2,1), filter 500ms ease;
    }

    .rose-button:hover .rose-art,
    .rose-button:focus-visible .rose-art {
      transform: translateY(-7px) rotate(.8deg) scale(1.02);
      filter: saturate(1.04) drop-shadow(0 28px 28px rgba(111,43,59,.22));
    }

    @keyframes rose-bloom-in {
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    .rose-button:focus-visible {
      outline: 2px solid rgba(173,46,76,.55);
      outline-offset: 10px;
      border-radius: 45%;
    }

    .rose-glow {
      position: absolute;
      z-index: -1;
      top: 24%;
      left: 50%;
      width: 230px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,255,255,.52);
      filter: blur(28px);
      transform: translateX(-50%) scale(.7);
      opacity: 0;
      animation: glow-in 1.2s 3.4s forwards;
    }

    @keyframes glow-in { to { opacity: 1; transform: translateX(-50%) scale(1); } }

    .tap-hint {
      position: absolute;
      bottom: clamp(24px, 6vh, 62px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--rose-deep);
      font-family: var(--script);
      font-size: clamp(1.7rem, 5vw, 2.35rem);
      opacity: 0;
      transform: translateY(12px);
      animation: hint-in 700ms 3.8s forwards, hint-float 1.7s 4.5s ease-in-out infinite alternate;
    }

    .tap-hint small { font-family: var(--sans); font-size: .62rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }

    @keyframes hint-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes hint-float { to { transform: translateY(-7px); } }

    .sparkle {
      position: absolute;
      color: var(--gold);
      font-size: var(--size);
      opacity: 0;
      animation: sparkle 1.8s var(--delay) ease-in-out infinite;
    }

    @keyframes sparkle { 50% { opacity: 1; transform: scale(1.25) rotate(40deg); } }

    .gift-scene {
      z-index: 2;
      opacity: 0;
      transform: scale(.95);
    }

    .gift-scene.is-active { opacity: 1; transform: scale(1); }

    .heart-copy {
      position: absolute;
      top: clamp(20px, 5vh, 52px);
      left: 50%;
      width: min(520px, 88vw);
      height: 165px;
      transform: translateX(-50%);
      opacity: .72;
    }

    .heart-copy path { fill: none; stroke: rgba(217,75,103,.35); stroke-width: 1.3; stroke-dasharray: 5 5; }
    .heart-copy text { fill: var(--rose-deep); font-family: var(--script); font-size: 15px; }

    .gift-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(620px, 96vw);
      min-height: 620px;
      padding-top: 86px;
    }

    .gift-title {
      position: absolute;
      z-index: 3;
      top: 0;
      width: 100%;
      margin: 0;
      color: var(--rose-deep);
      font-family: var(--script);
      font-size: clamp(2.3rem, 7vw, 4rem);
      text-align: center;
    }

    .gift-title span { display: block; margin-top: 4px; font-family: var(--sans); font-size: .65rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }

    .valentine {
      position: relative;
      width: 330px;
      height: 310px;
      animation: envelope-float 3s ease-in-out infinite;
    }

    @keyframes envelope-float { 50% { transform: translateY(-25px); } }

    .shadow {
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: 300px;
      height: 26px;
      border-radius: 50%;
      background: rgba(110,58,70,.2);
      filter: blur(4px);
      transform: translateX(-50%);
      animation: shadow-breathe 3s ease-in-out infinite;
    }

    @keyframes shadow-breathe { 50% { width: 250px; opacity: .58; } }

    .envelope {
      position: absolute;
      left: 15px;
      top: 78px;
      width: 300px;
      height: 195px;
      border-radius: 10px;
      background: #ef7181;
      box-shadow: 0 22px 45px rgba(137,50,69,.22);
    }

    .envelope::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      clip-path: polygon(0 0, 50% 58%, 100% 0);
      background: #f58b98;
    }

    .letter-preview {
      position: absolute;
      z-index: 2;
      left: 30px;
      top: 64px;
      width: 270px;
      height: 168px;
      padding: 22px 20px;
      border-radius: 7px;
      color: var(--rose-deep);
      background: var(--paper);
      box-shadow: 0 -10px 35px rgba(92,43,53,.16);
      text-align: center;
      transition: transform 650ms cubic-bezier(.2,.9,.2,1);
    }

    .valentine:hover .letter-preview,
    .valentine:focus-within .letter-preview { transform: translateY(-88px); }

    .letter-preview::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed #eaa0ad;
      border-radius: 5px;
    }

    .letter-preview strong {
      position: relative;
      z-index: 1;
      display: block;
      font-family: var(--script);
      font-size: 2rem;
      line-height: 1.05;
    }

    .letter-preview span {
      position: relative;
      z-index: 1;
      display: inline-block;
      margin-top: 12px;
      font-size: .58rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .envelope-front {
      position: absolute;
      z-index: 4;
      left: 15px;
      top: 78px;
      width: 300px;
      height: 195px;
      overflow: hidden;
      border-radius: 0 0 10px 10px;
      pointer-events: none;
    }

    .envelope-front::before,
    .envelope-front::after { content: ""; position: absolute; inset: 0; }
    .envelope-front::before { clip-path: polygon(0 0, 54% 100%, 0 100%); background: #f7a0a7; }
    .envelope-front::after { clip-path: polygon(100% 0, 46% 100%, 100% 100%); background: #f48e99; }

    .open-letter-button {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 214px;
      display: grid;
      place-items: center;
      width: 70px;
      aspect-ratio: 1;
      border: 4px double #f5c1a5;
      border-radius: 50%;
      color: white;
      background: var(--rose-deep);
      cursor: pointer;
      font-family: var(--script);
      font-size: 1.25rem;
      box-shadow: 0 8px 18px rgba(121,39,58,.24);
      transform: translateX(-50%);
      transition: transform 180ms ease;
    }

    .open-letter-button:hover { transform: translateX(-50%) scale(1.08) rotate(-4deg); }

    .floating-hearts { position: absolute; z-index: 5; left: 50%; top: 44px; width: 240px; height: 190px; transform: translateX(-50%); pointer-events: none; }

    .tiny-heart {
      position: absolute;
      left: var(--x);
      bottom: 0;
      width: var(--size);
      aspect-ratio: 1;
      background: var(--color);
      transform: rotate(45deg) scale(.3);
      animation: heart-rise var(--speed) var(--delay) ease-out infinite;
    }

    .tiny-heart::before,
    .tiny-heart::after { content: ""; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: inherit; }
    .tiny-heart::before { left: -50%; }
    .tiny-heart::after { top: -50%; }

    @keyframes heart-rise { to { opacity: 0; transform: translateY(-180px) rotate(45deg) scale(1.1); } }

    .gift-tip {
      position: absolute;
      bottom: 8px;
      margin: 0;
      color: #9b5a6a;
      font-size: .72rem;
      letter-spacing: .08em;
    }

    .letter-overlay {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(70,33,44,.76);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 450ms ease, visibility 450ms;
    }

    .letter-overlay.is-open { opacity: 1; visibility: visible; }

    .letter-wrap {
      position: relative;
      width: min(780px, 96vw);
      min-height: min(530px, 88svh);
      transform: translateY(28px) scale(.95) rotate(-1deg);
      transition: transform 600ms cubic-bezier(.2,.9,.2,1);
    }

    .letter-overlay.is-open .letter-wrap { transform: translateY(0) scale(1) rotate(0); }

    .back-paper {
      position: absolute;
      inset: 10px -3px -5px 8px;
      border-radius: 24px;
      background: #f4cbd0;
      transform: rotate(-4deg);
      box-shadow: 0 25px 60px rgba(41,15,23,.28);
    }

    .letter-card {
      position: relative;
      display: grid;
      grid-template-columns: .78fr 1.22fr;
      min-height: min(530px, 88svh);
      overflow: hidden;
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(54,18,29,.3);
    }

    .gift-side {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, #f9bdc5, #f28fa1);
    }

    .gift-box {
      position: relative;
      width: 160px;
      height: 130px;
      border-radius: 8px;
      background: #fff2e5;
      box-shadow: 0 18px 30px rgba(118,48,64,.18);
      animation: gift-bob 2.2s ease-in-out infinite alternate;
    }

    @keyframes gift-bob { to { transform: translateY(-10px) rotate(2deg); } }

    .gift-box::before { content: ""; position: absolute; left: 62px; inset-block: 0; width: 36px; background: var(--rose); }
    .gift-box::after { content: ""; position: absolute; left: -8px; right: -8px; top: -18px; height: 32px; border-radius: 7px; background: #fff8ef; box-shadow: inset 0 -7px 0 #f0d7c3; }

    .bow, .bow::before, .bow::after { position: absolute; background: var(--rose); }
    .bow { z-index: 2; top: -28px; left: 68px; width: 24px; height: 24px; border-radius: 50%; }
    .bow::before, .bow::after { content: ""; top: -7px; width: 45px; height: 34px; border-radius: 60% 50% 10% 50%; }
    .bow::before { right: 17px; transform: rotate(15deg); }
    .bow::after { left: 17px; transform: scaleX(-1) rotate(15deg); }

    .side-heart { position: absolute; color: rgba(255,255,255,.65); font-size: var(--size); animation: side-float 2.4s var(--delay) ease-in-out infinite alternate; }
    @keyframes side-float { to { transform: translateY(-14px) rotate(12deg); } }

    .letter-content {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: clamp(34px, 6vw, 64px);
    }

    .letter-content::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 2px dashed #efb7bf;
      border-radius: 16px;
      pointer-events: none;
    }

    .letter-content h2 {
      position: relative;
      margin: 0 0 18px;
      color: var(--rose-deep);
      font-family: var(--script);
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1;
    }

    .typed-message {
      position: relative;
      min-height: 230px;
      margin: 0;
      color: #654650;
      font-family: var(--script);
      font-size: clamp(1.25rem, 2.8vw, 1.75rem);
      line-height: 1.5;
      white-space: pre-line;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -.1em;
      background: var(--rose);
      animation: cursor-blink .75s step-end infinite;
    }

    @keyframes cursor-blink { 50% { opacity: 0; } }

    .close-letter {
      position: fixed;
      z-index: 3;
      top: 20px;
      right: 20px;
      display: grid;
      place-items: center;
      width: 44px;
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 50%;
      color: white;
      background: rgba(89,38,51,.35);
      cursor: pointer;
      font-size: 1.35rem;
    }

    .burst-heart {
      position: fixed;
      z-index: 40;
      bottom: -30px;
      color: var(--heart-color);
      pointer-events: none;
      animation: burst-up var(--speed) ease-out forwards;
    }

    @keyframes burst-up { to { opacity: 0; transform: translate(var(--drift), -110svh) rotate(35deg); } }

    button:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 5px; }

    @media (max-width: 680px) {
      .intro-label {
        width: 88vw;
        font-size: .58rem;
        line-height: 1.65;
        letter-spacing: .13em;
      }
      .rose-button {
        width: min(300px, 70vw);
        transform: translateX(-3vw);
      }
      .heart-copy { top: 18px; height: 140px; }
      .gift-stage { min-height: 560px; padding-top: 82px; }
      .gift-title { top: 10px; }
      .letter-overlay { padding: 14px; }
      .letter-wrap, .letter-card { min-height: min(690px, 90svh); }
      .letter-card { grid-template-columns: 1fr; grid-template-rows: 190px 1fr; }
      .gift-box { width: 115px; height: 88px; }
      .gift-box::before { left: 44px; width: 27px; }
      .bow { left: 47px; }
      .letter-content { padding: 38px 30px 30px; }
      .typed-message { min-height: 290px; font-size: clamp(1.18rem, 5.2vw, 1.5rem); overflow-y: auto; }
      .close-letter { top: 10px; right: 10px; }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      .rose-button { width: 310px; }
      .intro-inner { min-height: 96svh; }
      .gift-stage { min-height: 96svh; transform: scale(.82); }
      .letter-card { min-height: 88svh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
      .tap-hint { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <section class="scene intro-scene" id="intro-scene" aria-labelledby="intro-title">
    <div class="intro-inner">
      <p class="intro-label" id="intro-title">Một bông hoa dành riêng cho Trần Trang</p>
      <span class="sparkle" style="top:18%;left:12%;--size:1.5rem;--delay:3.4s" aria-hidden="true">✦</span>
      <span class="sparkle" style="top:30%;right:10%;--size:1rem;--delay:3.8s" aria-hidden="true">✦</span>
      <span class="sparkle" style="bottom:25%;left:18%;--size:1.1rem;--delay:4.1s" aria-hidden="true">✧</span>
      <button class="rose-button" id="rose-button" type="button" aria-label="Chạm vào bông hồng để mở món quà">
        <span class="rose-glow" aria-hidden="true"></span>
        <img class="rose-art" src="assets/rose-realistic.png" alt="Bông hồng màu hồng đang nở" width="1024" height="1536">
      </button>
      <p class="tap-hint">Chạm vào bông hoa <small>một điều bất ngờ đang chờ em</small></p>
    </div>
  </section>

  <section class="scene gift-scene" id="gift-scene" hidden aria-labelledby="gift-title">
    <svg class="heart-copy" viewBox="0 0 520 180" aria-hidden="true">
      <path id="heart-path" d="M260 150 C100 95 105 18 180 20 C225 20 250 55 260 72 C270 55 295 20 340 20 C415 18 420 95 260 150Z"/>
      <text><textPath href="#heart-path" startOffset="2%">Happy Women’s Day · Gửi Trần Trang · With all my love · 20/10 · </textPath></text>
    </svg>
    <div class="gift-stage">
      <h1 class="gift-title" id="gift-title">Happy Women’s Day, Trang!<span>20 tháng 10 · dành riêng cho em</span></h1>
      <div class="valentine">
        <div class="shadow" aria-hidden="true"></div>
        <div class="envelope" aria-hidden="true"></div>
        <div class="letter-preview">
          <strong>Gửi Trang<br>thương mến</strong>
          <span>một lá thư nhỏ</span>
        </div>
        <div class="envelope-front" aria-hidden="true"></div>
        <div class="floating-hearts" aria-hidden="true">
          <i class="tiny-heart" style="--x:12%;--size:12px;--color:#d94b67;--speed:1.9s;--delay:0s"></i>
          <i class="tiny-heart" style="--x:30%;--size:9px;--color:#ee7890;--speed:2.4s;--delay:.4s"></i>
          <i class="tiny-heart" style="--x:48%;--size:13px;--color:#c93b5b;--speed:2.1s;--delay:.8s"></i>
          <i class="tiny-heart" style="--x:68%;--size:10px;--color:#f08ca0;--speed:2.6s;--delay:.2s"></i>
          <i class="tiny-heart" style="--x:84%;--size:8px;--color:#d94b67;--speed:2.2s;--delay:1s"></i>
        </div>
        <button class="open-letter-button" id="open-letter" type="button" aria-haspopup="dialog">Mở thư</button>
      </div>
      <p class="gift-tip">Chạm vào dấu niêm phong nhé ♡</p>
    </div>
  </section>

  <div class="letter-overlay" id="letter-overlay" role="dialog" aria-modal="true" aria-labelledby="letter-title" aria-hidden="true">
    <button class="close-letter" id="close-letter" type="button" aria-label="Đóng lá thư">×</button>
    <div class="letter-wrap">
      <div class="back-paper" aria-hidden="true"></div>
      <article class="letter-card">
        <div class="gift-side" aria-hidden="true">
          <span class="side-heart" style="top:14%;left:15%;--size:1.5rem;--delay:0s">♥</span>
          <span class="side-heart" style="top:24%;right:14%;--size:1rem;--delay:.5s">♥</span>
          <span class="side-heart" style="bottom:16%;left:20%;--size:1.1rem;--delay:.8s">♥</span>
          <span class="side-heart" style="bottom:12%;right:17%;--size:1.8rem;--delay:.3s">♥</span>
          <div class="gift-box"><span class="bow"></span></div>
        </div>
        <div class="letter-content">
          <h2 id="letter-title">Trang thương mến,</h2>
          <p class="typed-message"><span id="typed-message"></span><span class="cursor" id="cursor" aria-hidden="true"></span></p>
        </div>
      </article>
    </div>
  </div>

  <script>
    const introScene = document.querySelector("#intro-scene");
    const roseButton = document.querySelector("#rose-button");
    const giftScene = document.querySelector("#gift-scene");
    const openLetterButton = document.querySelector("#open-letter");
    const closeLetterButton = document.querySelector("#close-letter");
    const letterOverlay = document.querySelector("#letter-overlay");
    const typedMessage = document.querySelector("#typed-message");
    const cursor = document.querySelector("#cursor");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const message = "Nhân ngày 20/10, anh chúc cô gái anh thương luôn xinh đẹp, vui vẻ và bình an.\n\nCảm ơn em vì đã xuất hiện, khiến những ngày bình thường của anh trở nên thật đặc biệt. Mong nụ cười ấy sẽ luôn ở trên môi em — hôm nay, ngày mai và thật nhiều ngày sau nữa.\n\nThương em thật nhiều! ♡";
    let typingTimer;

    function showGift() {
      introScene.classList.add("is-leaving");
      window.setTimeout(() => {
        introScene.hidden = true;
        giftScene.hidden = false;
        requestAnimationFrame(() => giftScene.classList.add("is-active"));
        openLetterButton.focus();
      }, reducedMotion ? 0 : 680);
    }

    function typeLetter() {
      window.clearTimeout(typingTimer);
      typedMessage.textContent = "";

      if (reducedMotion) {
        typedMessage.textContent = message;
        cursor.hidden = true;
        return;
      }

      let index = 0;
      const typeNext = () => {
        typedMessage.textContent += message[index];
        index += 1;
        if (index < message.length) {
          typingTimer = window.setTimeout(typeNext, message[index - 1] === "." ? 120 : 34);
        } else {
          cursor.hidden = true;
        }
      };
      cursor.hidden = false;
      typingTimer = window.setTimeout(typeNext, 500);
    }

    function releaseHearts() {
      const colors = ["#d94b67", "#f58aa0", "#e7b96c", "#ffffff"];
      for (let index = 0; index < 22; index += 1) {
        const heart = document.createElement("span");
        heart.className = "burst-heart";
        heart.textContent = index % 4 === 0 ? "✦" : "♥";
        heart.style.left = `${8 + Math.random() * 84}%`;
        heart.style.fontSize = `${12 + Math.random() * 18}px`;
        heart.style.setProperty("--heart-color", colors[index % colors.length]);
        heart.style.setProperty("--drift", `${-60 + Math.random() * 120}px`);
        heart.style.setProperty("--speed", `${2.7 + Math.random() * 1.5}s`);
        heart.style.animationDelay = `${Math.random() * .5}s`;
        document.body.appendChild(heart);
        window.setTimeout(() => heart.remove(), 5000);
      }
    }

    function openLetter() {
      letterOverlay.classList.add("is-open");
      letterOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("letter-is-open");
      typeLetter();
      releaseHearts();
      closeLetterButton.focus();
    }

    function closeLetter() {
      window.clearTimeout(typingTimer);
      letterOverlay.classList.remove("is-open");
      letterOverlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("letter-is-open");
      openLetterButton.focus();
    }

    roseButton.addEventListener("click", showGift);
    openLetterButton.addEventListener("click", openLetter);
    closeLetterButton.addEventListener("click", closeLetter);

    letterOverlay.addEventListener("click", (event) => {
      if (event.target === letterOverlay) closeLetter();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && letterOverlay.classList.contains("is-open")) closeLetter();
    });
  </script>
</body>
</html>
