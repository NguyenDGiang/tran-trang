<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f8b">
  <title>Scan me — Quà 20/10 cho Trần Trang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #54343e;
      --pink: #d94b67;
      --peach: #f58a9a;
      --purple: #b75b77;
      --yellow: #e7b96c;
      --bg: #fbe3e5;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.8), transparent 25rem),
        radial-gradient(circle at 88% 88%, rgba(217,75,103,.17), transparent 25rem),
        var(--bg);
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .card {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 14px;
      width: min(900px, 100%);
      padding: 14px;
      border-radius: 38px;
      background: #fffaf5;
      box-shadow: 0 30px 80px rgba(52,38,64,.14);
    }

    .intro {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 530px;
      overflow: hidden;
      padding: clamp(28px, 5vw, 54px);
      border-radius: 27px;
      color: white;
      background: linear-gradient(145deg, #cf405f, #f18296);
    }

    .intro::before,
    .intro::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50%;
    }

    .intro::before { width: 240px; aspect-ratio: 1; right: -100px; top: -80px; }
    .intro::after { width: 120px; aspect-ratio: 1; right: 30px; top: 40px; }

    .label {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 40px 0;
      font-family: "Dancing Script", cursive;
      font-size: clamp(4.4rem, 10vw, 8rem);
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: .78;
    }

    h1 span {
      display: block;
      margin-top: 22px;
      font-family: "Dancing Script", cursive;
      font-size: .32em;
      letter-spacing: 0;
      line-height: 1.25;
    }

    .note {
      position: relative;
      z-index: 1;
      margin: 0;
      color: rgba(255,255,255,.8);
      font-size: .85rem;
      line-height: 1.65;
    }

    .scan {
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 530px;
      padding: clamp(30px, 6vw, 66px);
      border-radius: 27px;
      background: #fff5f2;
      text-align: center;
    }

    .scan-tag {
      margin: 0 0 24px;
      padding: 8px 13px;
      border-radius: 99px;
      color: white;
      background: var(--pink);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    .qr-wrap {
      position: relative;
      width: min(290px, 68vw);
      padding: 16px;
      border: 3px solid var(--ink);
      border-radius: 24px;
      background: white;
      box-shadow: 10px 10px 0 #f3bcc3;
    }

    .qr-wrap::after {
      content: "♥";
      position: absolute;
      right: -22px;
      top: -25px;
      display: grid;
      place-items: center;
      width: 54px;
      aspect-ratio: 1;
      border-radius: 17px;
      color: white;
      background: var(--pink);
      font-size: 1.6rem;
      transform: rotate(8deg);
      box-shadow: 0 9px 20px rgba(81,45,97,.2);
    }

    .qr-wrap img { display: block; width: 100%; aspect-ratio: 1; }

    .instruction {
      margin: 30px 0 6px;
      font-family: "Dancing Script", cursive;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hint { margin: 0; color: #716b7a; font-size: .73rem; line-height: 1.6; }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .card { grid-template-columns: 1fr; padding: 10px; border-radius: 30px; }
      .intro { min-height: 360px; border-radius: 22px; }
      .scan { min-height: 520px; border-radius: 22px; }
      h1 { margin-block: 28px; }
    }

    @media print {
      body { padding: 0; background: white; }
      .card { width: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="intro">
      <p class="label">A little surprise for you ♡</p>
      <h1>20/10<span>Gửi Trang thương mến</span></h1>
      <p class="note">Có một món quà nhỏ, một lời chúc xinh và rất nhiều yêu thương ở phía bên kia.</p>
    </section>
    <section class="scan">
      <p class="scan-tag">Scan me ♡</p>
      <div class="qr-wrap">
        <img src="ma-qr-20-10.png?v=2" alt="Mã QR mở món quà 20/10 dành cho Trần Trang">
      </div>
      <p class="instruction">Quét để mở điều anh muốn nói 💌</p>
      <p class="hint">Dùng camera điện thoại và chạm vào đường dẫn hiện ra</p>
    </section>
  </main>
</body>
</html>
